<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELL Strategies</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff0f3ff;
            color: #590d22ff;
            padding-top: 5rem;
        }
        .container {
            max-width: 800px;
        }
        .strategy-item {
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .strategy-item:hover {
            background-color: #ffccd5;
        }
        .glossary-content {
            display: none;
            padding: 1rem;
            margin-top: 0.5rem;
            border-left: 4px solid;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .strategy-list-card {
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.4s ease-in-out;
        }
        .banner {
            position: relative;
            height: 20rem;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/db/Cherry_BLOSSOM_%28Unsplash%29.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            filter: sepia(0.5) hue-rotate(-20deg) saturate(1.5) brightness(0.9);
        }
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #800f2fff;
            opacity: 0.4;
        }
        .banner-content {
            position: relative;
            z-index: 10;
            color: #fff;
            padding: 1rem;
        }
        .banner-content h1 {
            font-family: 'Caveat', cursive;
        }
        .api-button {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            margin-top: 0.5rem;
            color: #590d22ff;
            display: inline-flex;
            align-items: center;
        }
        .api-button:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .api-button svg {
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.25rem;
        }
        .spinner {
            border: 2px solid #590d22ff;
            border-radius: 50%;
            border-top: 2px solid transparent;
            width: 1rem;
            height: 1rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .arrow {
            transition: transform 0.2s ease-in-out;
        }
        .arrow-rotated {
            transform: rotate(90deg);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="container mx-auto">
        <div class="banner">
            <div class="banner-content">
                <h1 class="text-6xl md:text-7xl font-bold mb-2">Strategies for English Language Learners</h1>
                <p class="text-lg">Simple, research-based tools to support ALL learners</p>
            </div>
        </div>
        <div class="flex flex-col md:flex-row md:justify-center items-center mb-6 space-y-4 md:space-y-0 md:space-x-4">
            <div class="flex items-center space-x-2">
                <label for="category-filter" class="font-semibold">Filter by Type:</label>
                <select id="category-filter" class="rounded-full px-4 py-2 border-2 border-pink-500 bg-white shadow-md focus:outline-none focus:ring-2 focus:ring-pink-500">
                    <option value="All Strategies">All Strategies</option>
                    <option value="Teacher-Centered">Teacher-Centered</option>
                    <option value="Student-Centered">Student-Centered</option>
                    <option value="Vocabulary">Vocabulary</option>
                </select>
            </div>
            <div class="flex items-center space-x-2 w-full md:w-auto">
                <label for="topic-input" class="font-semibold">Topic:</label>
                <input type="text" id="topic-input" placeholder="e.g., Photosynthesis" class="flex-grow rounded-full px-4 py-2 border-2 border-pink-500 bg-white shadow-md focus:outline-none focus:ring-2 focus:ring-pink-500" />
            </div>
        </div>
    </div>

    <main id="strategies-container" class="container mx-auto mt-8">
        <!-- Content will be generated here by JavaScript -->
    </main>
    
     <div id="source-documents-container" class="container mx-auto mt-8 mb-8">
            <div class="strategy-list-card p-6">
                <h2 class="text-2xl font-bold mb-4">Expert Resources</h2>
                <ul class="space-y-2">
                    <li><a href="https://drive.google.com/file/d/16cNSZ8n0oaMukREnCED_Oler7xCWrXr2/view?usp=sharing" class="text-pink-500 hover:underline" target="_blank">Rojas Vocabulary Activities (PDF)</a></li>
                    <li><a href="https://drive.google.com/file/d/1MWrSMkEs7DxQGqj1Ikjp0kMAlF9TdJR2/view?usp=sharing" class="text-pink-500 hover:underline" target="_blank">Rojas Cooperative Learning Activities (PDF)</a></li>
                    <li><a href="https://drive.google.com/file/d/1eFTAS8xA9dCNnGK5Sxb_yUPua4YhGDR1/view?usp=sharing" class="text-pink-500 hover:underline" target="_blank">Center of Applied Linguistics Go-To Strategies (PDF)</a></li>
                </ul>
            </div>
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const teacherCentered = [
                "Anticipation Guides", "Cloze Passages", "Dictations", "Directed Reading/Thinking (DRTA)", "Guided Imagery",
                "Guided Reading", "Listen and Point", "Listen-Read-Discuss", "Model Academic Language", "Picture Walk",
                "Shared Reading", "Shared Writing", "Structured Note-Taking", "Teach the Text Backward", "Teacher Read Aloud",
                "Teacher Talk", "Think Alouds", "Total Physical Response", "Wait Time", "Wait Time Two"
            ].sort();
            
            const studentCenteredAndCollaborative = [
                "4 to 1", "Act It Out", "Brainstorming", "Choral Reading", "Circle-the-Sage", "Closed Sort Tasks", "Cognates", "Collaborative Dialogues",
                "Concept/Idea Maps", "Content Learning Logs", "Contextualize Language", "Corners", "Cornell Notes", "Dialogue Journals", "Draw What I Say", "Exit Slips", "Fact or Fiction", "Field Trips", "First Language Support", "Fish Bowl", "Four Corners", "Give One - Get One",
                "Graphic Features", "Graphic Organizers", "Graphic Organizers for Writing", "H Charts", "Hand-on Activities", "Headbands", "I Have... Who Has...?",
                "Information Gap", "Inside/Outside Circle", "Jigsaw Problem Solving", "Key Sentence Frames", "K-W-L Chart",
                "Language Experience Approach (LEA)", "Line Ups", "Memory Lane", "Mix-Freeze-Group", "Mix and Match", "Numbered Heads Together", "One Stray", "One-Word", "One-Word Sentences", "Open Sort Tasks",
                "Pairs Check or Pairs Compare", "Paraphrase Passport", "Patterned Oral Language", "Peer-Assisted Learning Strategies (PALS)", "Picture Word Inductive Model",
                "Plus/Delta Chart", "Posters", "Q-Spinner", "Question-Answer Relationships (QAR)", "Quickwrites", "RallyCoach", "Reader's Theatre",
                "Reading Logs", "Reciprocal Teaching", "Report Frames", "Role Play", "Rotating Review", "Roundtable", "Roving Charts", "Say Something", "Say it Again",
                "Self-Assessment Scales for Vocabulary Learning", "Semantic Feature Analysis", "Semantic Mapping", "Sentence-Picture Match", "Showdown", "Single Round Robin", "Snowball", "Stir the Class", "Story Maps",
                "Strategy Cards", "Symbolic Storyboarding", "T Charts", "Tableaux", "Team-Pair-Solo", "Text to Graphics and Back Again", "Think-Pair-Share",
                "Think-Pair-Share Squared", "Think-Write-Pair-Share", "Three Step Interview", "Ticket to Leave", "Turn and Talk", "Varied Grouping Formats", "Varied Questioning Formats",
                "Wordless Picture Books", "Word Walls", "Word/Picture Banks", "Write About It", "Write a Letter", "Written Conversation", "Writer's Workshop"
            ].sort();

            const vocabularyStrategies = [
                "Analogies", "Character Trait Maps", "Click and Clunk", "Concept Definition Mapping", "Connect-Two",
                "Contextual Redefinition", "Find Someone Who", "Four-Dimensional Word Study", "4-Square Vocabulary Approach",
                "Frayer Model", "Interactive Word Wall", "Magnetic Reading", "Memory Box", "My Favorite Word",
                "Personal Dictionaries", "Semantic Feature Analysis", "Semantic Mapping", "Word Map", "Word Sorts"
            ].sort();

            const categorizedStrategies = {
                "Teacher-Centered": teacherCentered,
                "Student-Centered": studentCenteredAndCollaborative,
                "Vocabulary": vocabularyStrategies
            };
            
            const allStrategies = Object.values(categorizedStrategies).flat().sort();

            const glossaryData = {
                "Analogies": "A strategy where students make connections between new vocabulary words and familiar concepts, helping them infer meaning and build understanding of complex relationships.",
                "Character Trait Maps": "A visual tool used to help students analyze and describe a character in a text. Students write the character's name in the center and use branches to list various traits with supporting evidence.",
                "Click and Clunk": "A metacognitive strategy that teaches students to monitor their comprehension while reading. When they understand a word or phrase, it 'clicks.' When they don't, it 'clunks,' and they use a fix-up strategy.",
                "Concept Definition Mapping": "A graphic organizer that helps students understand new concepts by defining them, providing examples and non-examples, and relating them to a superordinate category.",
                "Connect-Two": "A vocabulary tool where students link two related concepts or terms and explain the connection between them, fostering deeper understanding. This encourages students to think about the connections between ideas rather than memorizing terms in isolation.",
                "Contextual Redefinition": "A strategy where students work in groups to predict the meaning of a new word using its context. After group discussion, the teacher provides the correct definition, and students re-evaluate their predictions.",
                "Find Someone Who": "A collaborative activity where students walk around the classroom asking their peers questions related to a topic. The goal is to find a different person who can answer each question and write their name down.",
                "Four-Dimensional Word Study": "An in-depth strategy for vocabulary development where students explore a word from multiple perspectives: sound, form, meaning, and usage. This multi-faceted approach helps solidify a student's understanding of a new word.",
                "4-Square Vocabulary Approach": "A graphic organizer that helps students deeply process new vocabulary words. The four squares include the word, its definition, an image or symbol, and a sentence using the word.",
                "Frayer Model": "A graphic organizer for building vocabulary. It has four sections: a definition, characteristics, examples, and non-examples.",
                "Interactive Word Wall": "A collaborative word wall where students can add words, definitions, and images as they learn new vocabulary.",
                "Magnetic Reading": "A strategy where teachers use a whiteboard and magnets with words or letters to model reading and spelling.",
                "Memory Box": "A personalized box where students collect objects, pictures, or notes related to a topic to help them recall information.",
                "My Favorite Word": "A vocabulary activity where students choose a new word they like and share its meaning and why they like it with the class.",
                "Personal Dictionaries": "Students create and maintain their own dictionaries with words they are learning, often with definitions, sentences, and illustrations.",
                "Semantic Feature Analysis": "A graphic organizer that helps students compare and contrast vocabulary words by their shared and unique characteristics.",
                "Semantic Mapping": "A visual strategy where students brainstorm related concepts and ideas around a central word, creating a web of connected terms.",
                "Word Map": "A visual tool that helps students understand new words. It usually includes the word, a definition, a sentence, and a related image or word.",
                "Word Sorts": "A vocabulary strategy where students group words into categories based on a specific rule or pattern. This helps them understand relationships between words and their meanings.",
                "Anticipation Guides": "A pre-reading activity where students agree or disagree with a series of statements related to the text they are about to read. This activates prior knowledge and sets a purpose for reading.",
                "Cloze Passages": "A reading comprehension strategy where words are removed from a text and students must fill in the blanks. It requires them to use context clues to determine the missing words.",
                "Dictations": "A listening and writing exercise where the teacher reads a passage or a series of sentences aloud, and students write them down verbatim. This practice strengthens listening and spelling skills.",
                "Directed Reading/Thinking (DRTA)": "A reading comprehension strategy that guides students through a text by having them make predictions, read to confirm or revise predictions, and then make new predictions. It teaches them to be active readers.",
                "Guided Imagery": "The teacher guides students through a mental journey or visualization to help them understand a concept or story.",
                "Guided Reading": "A small-group reading instruction strategy where the teacher works with students who read at a similar level. The teacher provides support and guidance as students read a new text.",
                "Listen and Point": "A listening comprehension activity where students listen to the teacher say a word and then point to the corresponding object or picture. It is a simple way to assess understanding.",
                "Listen-Read-Discuss": "A strategy where students first listen to the teacher read a text, then read it independently, and finally discuss it with a partner or group. This multi-modal approach improves comprehension.",
                "Model Academic Language": "The practice of using and explicitly teaching the precise vocabulary and grammatical structures of academic subjects. The teacher models how to talk and write like an expert in a field.",
                "Picture Walk": "A pre-reading strategy where students look through the pictures in a book with the teacher and discuss what they see. This builds background knowledge and helps them make predictions.",
                "Shared Reading": "A whole-group reading strategy where the teacher reads a text aloud to the students, who follow along in their own copies. It models fluent reading and builds comprehension.",
                "Shared Writing": "A collaborative writing strategy where the teacher and students compose a text together. The teacher acts as the scribe, writing down the students' ideas. This models the writing process.",
                "Structured Note-Taking": "A guided note-taking strategy where the teacher provides a pre-formatted template for students to fill in. This reduces the cognitive load of organizing notes.",
                "Teach the Text Backward": "A comprehension strategy where the teacher starts with the end of a lesson or a text and works backward. This helps students understand the overall purpose and key takeaways.",
                "Teacher Read Aloud": "A strategy where the teacher reads a text aloud to students, modeling fluent reading and engaging them in the story. It exposes students to new vocabulary and language structures.",
                "Teacher Talk": "The practice of being mindful of one's own speech when teaching, such as using simple language, clear pronunciation, and intentional repetition to make content more accessible to ELLs.",
                "Think Alouds": "A metacognitive strategy where the teacher verbalizes their thoughts and thinking process while reading a text, modeling how to make meaning.",
                "Total Physical Response": "A language acquisition strategy where students respond to commands with physical actions. This builds comprehension of new words in a low-anxiety way.",
                "Wait Time": "The intentional pause after asking a question before calling on a student to answer. This provides time for students to formulate a response.",
                "Wait Time Two": "The intentional pause after a student has finished speaking. This allows the student to elaborate and gives other students time to process what was said before the conversation continues.",
                "4 to 1": "A strategy for summarizing a text. Students identify four key concepts, four key details, four key vocabulary words, and one main idea.",
                "Act It Out": "A kinesthetic strategy where students physically act out a concept or vocabulary word to demonstrate understanding. It is especially effective for verbs and abstract concepts.",
                "Brainstorming": "A collaborative process where students generate ideas freely related to a topic. It encourages creative thinking and can be used to activate prior knowledge before a lesson.",
                "Choral Reading": "A fluency strategy where students read a text aloud together as a group. This reduces anxiety for emergent readers and helps build reading speed and prosody.",
                "Circle-the-Sage": "A cooperative peer input and concept exposure tool where a student with expertise on a topic sits in the center (the 'sage') and shares knowledge, while other students gather around to take notes and ask questions.",
                "Closed Sort Tasks": "A vocabulary strategy where students categorize a list of words or concepts into pre-determined categories. This helps them understand relationships between concepts.",
                "Cognates": "Words in two different languages that have a similar origin, spelling, and meaning (e.g., 'information' in English and 'información' in Spanish). Teaching cognates helps build vocabulary.",
                "Collaborative Dialogues": "A conversational strategy where students work in pairs or small groups to discuss a topic, solve a problem, or complete a task. This provides a low-stakes environment for language practice.",
                "Concept/Idea Maps": "A visual representation of a topic or concept, showing the relationships between main ideas and supporting details. This helps students organize information.",
                "Content Learning Logs": "A writing strategy where students maintain a notebook or journal to record their thoughts, questions, and new learning during a unit of study. It helps them process content.",
                "Corners": "This strategy is used to gauge student opinions or to facilitate a structured discussion. The teacher poses a question with several possible answers, and students move to the corner that represents their choice to discuss their reasoning with others. This technique ensures every student takes a stance and engages in dialogue.",
                "Cornell Notes": "A note-taking system where students divide their paper into three sections: a right column for notes, a left column for keywords and questions, and a bottom section for a summary. This helps organize and review information.",
                "Dialogue Journals": "A conversational writing strategy where a student writes to the teacher in a journal, and the teacher writes back. It provides authentic practice with written language and builds a rapport between teacher and student.",
                "Draw What I Say": "A cooperative strategy for peer interaction and concept exposure. One student describes an image, and their partner must draw it based on the verbal description, promoting careful listening and clear speaking.",
                "Exit Slips": "A quick, low-stakes assessment strategy where students write a short response to a prompt on a piece of paper before leaving class. It provides the teacher with immediate feedback on student understanding.",
                "Fact or Fiction": "A tool for interactive intake and concept development. The teacher presents statements related to a topic, and students must decide if each statement is a fact or fiction, providing rationale for their answers.",
                "Field Trips": "An instructional strategy that takes students outside of the classroom to experience a place or concept firsthand. This provides real-world context for learning.",
                "First Language Support": "The practice of allowing or encouraging students to use their native language to support their understanding of content. It can be used for brainstorming, note-taking, or clarifying concepts.",
                "Fish Bowl": "A cooperative learning strategy where a small group of students discusses a topic in a circle while the rest of the class sits in a larger circle and observes. This models effective discussion techniques.",
                "Four Corners": "A kinesthetic discussion strategy where students move to a designated corner of the room that corresponds to a statement of opinion or a response to a question. This promotes movement and engagement.",
                "Give One - Get One": "A collaborative activity where students walk around the room and exchange information with a partner. Each student 'gives' an idea they have and 'gets' an idea they don't have. It encourages peer interaction and review.",
                "Graphic Features": "Focuses on teaching students to use non-text features like headings, charts, graphs, and illustrations to understand content.",
                "Graphic Organizers": "A visual tool that helps students organize information, such as a Venn diagram, a T-chart, or a concept map. It makes relationships between ideas more explicit and accessible.",
                "Graphic Organizers for Writing": "Visual tools specifically designed to help students pre-write and plan their compositions. Examples include story maps, plot diagrams, and report frames.",
                "H Charts": "A graphic organizer with an H-shape, used to compare and contrast two concepts. The left column is for the first concept, the right for the second, and the middle is for similarities.",
                "Hand-on Activities": "An instructional strategy that allows students to learn by doing. These activities require students to manipulate physical objects to understand a concept.",
                "Headbands": "A game where students wear a card with a word or picture on their head without seeing it. They then ask 'yes' or 'no' questions to figure out what their word is. This is a fun way to practice vocabulary.",
                "I Have... Who Has...?": "A chain-reaction game where each student has a card with a question and an answer. The game begins with a student reading their 'Who has...?' question, and the student with the correct answer on their card responds with 'I have...' It is excellent for reviewing content.",
                "Information Gap": "A collaborative activity where students work in pairs to share information. Each student has a piece of information that the other needs to complete a task. It promotes authentic communication.",
                "Inside/Outside Circle": "A dynamic peer-to-peer discussion technique. Students form two concentric circles and rotate to discuss a topic or question with a series of partners. This allows students to interact with multiple peers in a single session.",
                "Jigsaw Problem Solving": "A cooperative strategy for peer interaction where students work together to solve a complex problem, with each member contributing a unique piece of the solution.",
                "Key Sentence Frames": "Sentence structures provided by the teacher to help students formulate their thoughts and responses. These scaffolds reduce the cognitive load of producing grammatically correct sentences.",
                "K-W-L Chart": "A graphic organizer used to activate prior knowledge and set a purpose for learning. Students write what they **K**now, what they **W**ant to know, and what they **L**earned.",
                "Language Experience Approach (LEA)": "A reading and writing strategy based on students' oral language. The teacher transcribes a story that the student dictates, which then becomes the reading material. It connects language with personal experiences.",
                "Line Ups": "A cooperative strategy for peer input. Students line up in a specific order based on a topic or criteria (e.g., from earliest to latest historical event), discussing their reasoning with peers as they position themselves.",
                "Memory Lane": "A game where students recall and share what they remember about a previous topic. This is a simple and effective way to review and connect old and new learning.",
                "Mix-Freeze-Group": "An interactive strategy for concept development. Students move around the room to music. When the music stops, the teacher calls out a number, and students form groups of that size and discuss a given topic or question.",
                "Mix and Match": "A vocabulary strategy where students match a term with its definition or an image. This can be done with cards, on a worksheet, or as a group activity.",
                "Numbered Heads Together": "Students in a small group number off, discuss a question, and then one student is randomly selected to provide the group's answer, ensuring every member is prepared to respond. This strategy promotes accountability and teamwork as every student needs to be prepared.",
                "One Stray": "A strategy for interactive intake and concept development. One member of a small group 'strays' and visits another group to listen to their discussion on a topic, then returns to their original group to share what they learned.",
                "One-Word": "A quick-write strategy where students respond to a prompt using a single word. It is a simple way to activate thinking and can be a springboard for further discussion.",
                "One-Word Sentences": "An oral language strategy where students are prompted to use a single, specific word to describe or respond to something. It is a scaffold for speaking.",
                "Open Sort Tasks": "A vocabulary strategy where students are given a list of words or concepts and asked to create their own categories to sort them into. This requires higher-order thinking and understanding of relationships.",
                "Pairs Check or Pairs Compare": "A cooperative strategy for oral output practice. Students work in pairs to complete a task. One student explains their answer while the other checks it, then they switch roles.",
                "Paraphrase Passport": "A collaborative tool that requires a student to orally paraphrase a new concept or idea to a partner before being allowed to 'pass' to the next task. This ensures understanding and provides oral practice.",
                "Patterned Oral Language": "The practice of using predictable sentence patterns to help students practice new vocabulary and grammatical structures. The teacher models the pattern, and students fill in the blanks.",
                "Peer-Assisted Learning Strategies (PALS)": "A structured cooperative learning strategy where students work in pairs to help each other learn. One student is the 'coach' and the other is the 'reader' or 'writer.'",
                "Picture Word Inductive Model": "A literacy strategy where students identify objects in a picture, and the teacher writes the words underneath. This helps them connect spoken words to their written form.",
                "Plus/Delta Chart": "A reflective tool where students list what worked well (**Plus**) and what needs to be improved (**Delta**) in an activity or lesson.",
                "Posters": "A collaborative project where students create a poster to visually represent a concept, a story, or key information from a text.",
                "Q-Spinner": "A cooperative learning tool for peer input. Students use a spinner or a similar random selection method to choose a partner or a question to answer, promoting varied interactions.",
                "Question-Answer Relationships (QAR)": "A reading comprehension strategy that teaches students to differentiate between questions that are answered 'right there' in the text, those that require 'think and search,' and those that are 'on my own' (from background knowledge).",
                "Quickwrites": "A short, timed writing activity where students write for a set period without worrying about grammar or spelling. It is a way to generate ideas and increase fluency.",
                "RallyCoach": "A cooperative learning structure where students work in pairs. One student performs a task, and the other coaches them, then they switch roles.",
                "Reader's Theatre": "A dramatic reading of a story or script. Students read from their scripts and use their voices and gestures to portray characters. It builds fluency and comprehension.",
                "Reading Logs": "A journal where students record their reading, summarize what they read, and respond to prompts about the text.",
                "Reciprocal Teaching": "A collaborative reading strategy where students take turns leading a group discussion about a text using four key skills: summarizing, questioning, clarifying, and predicting. It fosters active comprehension.",
                "Report Frames": "A writing scaffold that provides students with a structure for a report, with headings and sentence starters to guide their writing. It reduces the cognitive load of organizing a text.",
                "Role Play": "A kinesthetic strategy where students take on the roles of characters or professionals to act out a scene or a real-world scenario. This provides authentic language practice.",
                "Rotating Review": "A cooperative review tool where groups of students rotate through different stations, each with a review activity or question, to reinforce concepts learned.",
                "Roundtable": "A cooperative strategy for peer input and output practice. Students in a group take turns contributing to a single sheet of paper or whiteboard, passing it around the table to build a collective response.",
                "Roving Charts": "A collaborative brainstorming strategy where large pieces of paper are placed around the room with different topics. Students move from chart to chart, adding ideas to each one.",
                "Say Something": "A collaborative reading strategy where pairs of students read a text and pause at pre-determined points to 'say something' about what they're reading.",
                "Say it Again": "A tool for interactive language practice. A student says a word or phrase, and other students repeat it, reinforcing pronunciation and memory.",
                "Self-Assessment Scales for Vocabulary Learning": "A strategy where students use a rating scale to assess their own knowledge of new vocabulary words. This helps them monitor their own learning and set goals.",
                "Sentence-Picture Match": "A vocabulary or comprehension activity where students match a sentence to a corresponding picture. This connects written language to visual representation.",
                "Showdown": "A cooperative strategy for output practice and concept attainment. The teacher asks a question, students individually write their answer, and on the teacher’s signal, everyone 'shows down' their answer at the same time.",
                "Single Round Robin": "A tool for interactive practice. Students in a group take turns responding to a question or contributing an idea, ensuring all members participate.",
                "Snowball": "A collaborative writing strategy where each student writes an idea on a piece of paper, wads it up into a 'snowball,' and throws it to another student. They then open the new snowball and add to the idea.",
                "Stir the Class": "A kinesthetic strategy where students get up and move around the room to find a new partner or group to discuss a topic with. It encourages movement and varied interactions.",
                "Story Maps": "A graphic organizer that helps students identify and organize the key elements of a story, such as characters, setting, problem, and solution. It improves reading comprehension.",
                "Strategy Cards": "A tool that lists and explains different learning strategies. Students can refer to the cards to choose a strategy to apply to a new task. This promotes student self-regulation.",
                "Symbolic Storyboarding": "A strategy where students use simple pictures or symbols to represent the main ideas of a story or concept. It is a visual way to process and retell information.",
                "T Charts": "A graphic organizer with two columns, shaped like a 'T,' used to compare and contrast two concepts or to list the pros and cons of a topic.",
                "Tableaux": "A non-verbal, kinesthetic strategy where a group of students freezes in a pose to represent a scene, a moment, or an idea from a text. This helps students visualize and analyze a story.",
                "Team-Pair-Solo": "A cooperative learning strategy that moves students from working as a team, to working with a partner, and finally to working independently. This helps to build confidence by providing a supportive scaffold before requiring individual performance.",
                "Text to Graphics and Back Again": "A strategy where students transform a written text into a graphic organizer or visual representation, and then use that graphic to write a new text. This deepens understanding.",
                "Think-Pair-Share": "A collaborative strategy where students first think individually about a question, then pair up with a partner to discuss their thoughts, and finally share their ideas with the whole class.",
                "Think-Pair-Share Squared": "An extension of Think-Pair-Share where after the initial partner discussion, the pair joins another pair to form a group of four to discuss their ideas. This allows for more complex conversations.",
                "Think-Write-Pair-Share": "A writing-focused variation of Think-Pair-Share where students first write their thoughts, then discuss them with a partner, and finally share with the group.",
                "Three Step Interview": "A cooperative strategy for developing oral skills. Students are grouped into teams of four and share in three steps: 1. Pairs interview one another. 2. Pairs switch to share with a different partner. 3. All four students share together.",
                "Ticket to Leave": "A quick assessment strategy where students must complete a task or answer a question on a small piece of paper before they are allowed to leave the classroom.",
                "Turn and Talk": "A quick, informal speaking strategy where a student turns to a nearby partner to discuss a topic or answer a question. This provides more speaking opportunities than whole-class discussion.",
                "Varied Grouping Formats": "The practice of intentionally changing the size and composition of student groups (e.g., pairs, small groups, whole class). This promotes diverse interactions.",
                "Varied Questioning Formats": "The practice of using different types of questions (e.g., yes/no, multiple choice, open-ended) to check for understanding and promote deeper thinking.",
                "Wordless Picture Books": "A type of book that tells a story through illustrations alone. Students can use them to practice retelling skills and to build narrative language.",
                "Word Walls": "A classroom display of high-frequency words, academic vocabulary, or content-specific terms. It serves as a visual reference for students during reading and writing.",
                "Word/Picture Banks": "A visual and linguistic resource for students, consisting of a collection of key words and corresponding pictures, used to support reading and writing activities.",
                "Write About It": "A cooperative writing and language output tool where students respond in writing to a specific prompt, often as a way to process a new concept or idea.",
                "Write a Letter": "A writing strategy where students write a letter to the teacher, a classmate, or a fictional character about a topic. This provides an authentic and personal context for writing practice.",
                "Written Conversation": "A cooperative strategy for written output practice. Pairs of students have a silent 'conversation' by writing back and forth to each other on a single sheet of paper, promoting fluency in writing.",
                "Writer's Workshop": "A teaching approach that breaks down the writing process into mini-lessons, allowing students to work on their writing independently or with a partner. It focuses on the process of writing, not just the final product."
            };

            const strategiesContainer = document.getElementById('strategies-container');
            const filterDropdown = document.getElementById('category-filter');
            const topicInput = document.getElementById('topic-input');
            
            function renderStrategies(filterKey) {
                strategiesContainer.innerHTML = ''; // Clear previous content

                const strategiesToRender = filterKey === "All Strategies" ? allStrategies : categorizedStrategies[filterKey];

                const card = document.createElement('div');
                card.className = 'strategy-list-card p-6';

                const list = document.createElement('ul');
                list.className = 'space-y-2';

                strategiesToRender.forEach(strategyName => {
                    const listItem = document.createElement('li');
                    listItem.className = 'strategy-item cursor-pointer rounded-lg p-2 transition-all';
                    listItem.innerHTML = `
                        <span>${strategyName}</span>
                        <svg class="arrow" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 12L13 7 8 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    `;

                    listItem.addEventListener('click', () => {
                        const description = glossaryData[strategyName] || 'No description found.';
                        let glossaryDiv = listItem.nextElementSibling;
                        const arrow = listItem.querySelector('.arrow');

                        if (glossaryDiv && glossaryDiv.classList.contains('glossary-content')) {
                            const isVisible = glossaryDiv.style.display === 'block';
                            glossaryDiv.style.display = isVisible ? 'none' : 'block';
                            arrow.classList.toggle('arrow-rotated', !isVisible);
                        } else {
                            // Close any other open glossaries
                            document.querySelectorAll('.glossary-content').forEach(div => {
                                div.style.display = 'none';
                            });
                            document.querySelectorAll('.arrow').forEach(arr => {
                                arr.classList.remove('arrow-rotated');
                            });

                            glossaryDiv = document.createElement('div');
                            glossaryDiv.className = 'glossary-content border-pink-500 rounded-lg bg-pink-50';
                            
                            glossaryDiv.innerHTML = `
                                <p>${description}</p>
                                <button class="api-button mt-4 bg-pink-200 hover:bg-pink-300" id="generate-activity-btn">
                                    <span class="inline-block mr-1">✨</span>Generate Activity
                                </button>
                                <div class="example-output mt-4 border-t-2 border-pink-300 pt-4"></div>
                            `;
                            listItem.after(glossaryDiv);
                            glossaryDiv.style.display = 'block';
                            arrow.classList.add('arrow-rotated');

                            const generateActivityButton = glossaryDiv.querySelector('#generate-activity-btn');
                            const exampleOutput = glossaryDiv.querySelector('.example-output');
                            
                            generateActivityButton.addEventListener('click', () => {
                                const topic = topicInput.value.trim();
                                if (topic) {
                                    generateLessonActivity(strategyName, topic, generateActivityButton, exampleOutput);
                                } else {
                                    exampleOutput.innerHTML = '<p class="text-red-500">Please enter a topic first!</p>';
                                }
                            });
                        }
                    });
                    list.appendChild(listItem);
                });
                card.appendChild(list);
                strategiesContainer.appendChild(card);
            }

/**
             * The function that makes the call to the Gemini API with exponential backoff.
             * @param {string} systemPrompt - The instruction for the model's persona and task.
             * @param {string} userQuery - The main content/query for the model to process.
             * @returns {Promise<Object>} The JSON response from the API.
             */
            const apikey = 'AIzaSyASRNwmVsNNYJXPFBGzdGrWQ6x0k1L1I10';
            const geminiCall = async (systemPrompt, userQuery) => {
                // FIX: Model name updated to the current, supported preview model.
                const model = 'gemini-2.5-flash-preview-09-2025'; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    // Using Google Search grounding tool
                    tools: [{ "google_search": {} }],
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    },
                };

                const MAX_RETRIES = 5;
                for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        // Check for 404 explicitly to catch the old model issue faster
                        if (response.status === 404) {
                            throw new Error(`HTTP error! status: 404. Model '${model}' not found. Please check the model name in the API URL.`);
                        }

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        return response.json();

                    } catch (error) {
                        console.error(`Attempt ${attempt + 1} failed: ${error}`);
                        if (attempt === MAX_RETRIES - 1) {
                            throw new Error('Failed to connect to API after multiple retries.');
                        }
                        // Exponential backoff delay
                        const delay = Math.pow(2, attempt) * 1000 + Math.random() * 500;
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            };
            async function generateLessonActivity(strategyName, topic, button, outputDiv) {
                const originalButtonText = button.innerHTML;
                
                button.innerHTML = `<span class="spinner inline-block mr-2"></span> Planning...`;
                button.disabled = true;
                outputDiv.innerHTML = '';

                const systemPrompt = "You are an expert teacher and curriculum developer. Your task is to create a brief, actionable lesson plan activity. Do not include a full lesson plan; focus on a single activity. The response should be a concise paragraph that includes the strategy, the topic, and the steps for the activity. Use clear and encouraging language.";
                const userQuery = `Create a classroom activity for the strategy "${strategyName}" on the topic of "${topic}".`;

                try {
                    const result = await geminiCall(systemPrompt, userQuery);
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (text) {
                        outputDiv.innerHTML = `<p class="text-gray-700">${text}</p>`;
                        
                        // Dynamically add a highlight button
                        const highlightButton = document.createElement('button');
                        highlightButton.className = 'api-button mt-4 bg-purple-200 hover:bg-purple-300';
                        highlightButton.innerHTML = `<span class="inline-block mr-1">✨</span>Highlight Learning Goal`;
                        outputDiv.appendChild(highlightButton);

                        const highlightOutput = document.createElement('div');
                        highlightOutput.className = 'mt-4 text-purple-600';
                        outputDiv.appendChild(highlightOutput);
                        
                        highlightButton.addEventListener('click', () => {
                            highlightLearningGoal(text, highlightButton, highlightOutput);
                        });

                    } else {
                        outputDiv.innerHTML = '<p class="text-gray-700">No activity could be generated.</p>';
                    }
                } catch (error) {
                    console.error('Error generating activity:', error);
                    outputDiv.innerHTML = '<p class="text-red-500">Failed to generate activity. Please try again later.</p>';
                } finally {
                    button.innerHTML = originalButtonText;
                    button.disabled = false;
                }
            }

            async function highlightLearningGoal(textToAnalyze, button, outputDiv) {
                const originalButtonText = button.innerHTML;
                button.innerHTML = `<span class="spinner inline-block mr-2"></span> Highlighting...`;
                button.disabled = true;
                outputDiv.innerHTML = '';

                const systemPrompt = "You are an expert curriculum designer. Based on the following classroom activity, state the primary student learning goal in a single, clear, and concise sentence. Focus on what the student will be able to do or understand.";
                const userQuery = `Activity: ${textToAnalyze}`;

                try {
                    const result = await geminiCall(systemPrompt, userQuery);
                    const goal = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (goal) {
                        outputDiv.innerHTML = `<p class="text-gray-700 font-bold">Learning Goal: ${goal}</p>`;
                    } else {
                        outputDiv.innerHTML = '<p class="text-red-500">Could not identify a learning goal.</p>';
                    }
                } catch (error) {
                    console.error('Error highlighting learning goal:', error);
                    outputDiv.innerHTML = '<p class="text-red-500">An error occurred while generating the learning goal.</p>';
                } finally {
                    button.innerHTML = originalButtonText;
                    button.disabled = false;
                }
            }
            
            filterDropdown.addEventListener('change', (event) => {
                renderStrategies(event.target.value);
            });
            
            renderStrategies('All Strategies');
        });
    </script>
