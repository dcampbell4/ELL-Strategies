<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELL Strategies</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff0f3ff;
            color: #590d22ff;
        }
        .container {
            max-width: 800px;
        }
        .principle-button {
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
            color: #fff;
        }
        .principle-button.active {
            border: 2px solid #590d22ff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.12);
        }
        .strategy-item {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .strategy-item:hover {
            background-color: #ffccd5;
        }
        .glossary-content {
            display: none;
            padding: 1rem;
            margin-top: 0.5rem;
            border-left: 4px solid;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .principle-card {
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.4s ease-in-out;
        }
        .banner {
            position: relative;
            height: 20rem; /* Adjusted for better mobile and desktop view */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/db/Cherry_BLOSSOM_%28Unsplash%29.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            /* Add a sepia filter to match the reddish-pink theme */
            filter: sepia(0.5) hue-rotate(-20deg) saturate(1.5) brightness(0.9);
        }
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #800f2fff; /* Use a dark color from the palette */
            opacity: 0.4; /* Make it semi-transparent for text readability */
        }
        .banner-content {
            position: relative;
            z-index: 10;
            color: #fff;
            padding: 1rem;
        }
        .api-button {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            margin-top: 0.5rem;
            color: #590d22ff;
        }
        .api-button:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .api-button svg {
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.25rem;
        }
        .spinner {
            border: 2px solid #590d22ff;
            border-radius: 50%;
            border-top: 2px solid transparent;
            width: 1rem;
            height: 1rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 767px) {
            .principle-button {
                font-size: 0.75rem; /* Smaller font for buttons on small screens */
                padding: 0.5rem 0.75rem;
            }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="container mx-auto">
        <div class="banner">
            <div class="banner-content">
                <h1 class="text-3xl md:text-4xl font-bold mb-2">Strategies for English Language Learners</h1>
                <p class="text-lg">Click on a strategy to see its description and examples from the glossary.</p>
            </div>
        </div>

        <div id="principle-buttons" class="flex flex-wrap justify-center gap-4 mb-8">
            <a href="#focus-on-academic-language" class="principle-button px-4 py-2 rounded-full font-medium shadow-md transition-all" data-principle="Focus on Academic Language" style="background-color: #800f2fff;">Focus on Academic Language</a>
            <a href="#make-content-comprehensible" class="principle-button px-4 py-2 rounded-full font-medium shadow-md transition-all" data-principle="Make Content Comprehensible" style="background-color: #c9184aff;">Make Content Comprehensible</a>
            <a href="#provide-scaffolding-for-learning" class="principle-button px-4 py-2 rounded-full font-medium shadow-md transition-all" data-principle="Provide Scaffolding for Learning" style="background-color: #ff4d6dff;">Provide Scaffolding for Learning</a>
            <a href="#integrate-content-and-language-learning" class="principle-button px-4 py-2 rounded-full font-medium shadow-md transition-all" data-principle="Integrate Content and Language Learning" style="background-color: #ff758fff;">Integrate Content and Language Learning</a>
            <a href="#build-on-background-and-interests" class="principle-button px-4 py-2 rounded-full font-medium shadow-md transition-all" data-principle="Build on Background and Interests" style="background-color: #ff8fa3ff;">Build on Background and Interests</a>
        </div>

        <main id="strategies-container">
            </main>
    </div>
