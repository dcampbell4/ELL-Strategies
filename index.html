<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELL Strategies — Gemini Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fff0f3ff; color: #590d22ff; padding-top: 5rem; }
        .container { max-width: 800px; }
        .strategy-item { cursor: pointer; transition: background-color 0.2s ease; display: flex; justify-content: space-between; align-items: center; }
        .strategy-item:hover { background-color: #ffccd5; }
        .glossary-content { display: none; padding: 1rem; margin-top: 0.5rem; border-left: 4px solid; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .strategy-list-card { background-color: #ffffff; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); transition: all 0.4s ease-in-out; }
        .banner { position: relative; height: 20rem; background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/db/Cherry_BLOSSOM_%28Unsplash%29.jpg'); background-size: cover; background-position: center; border-radius: 1rem; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 2rem; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); filter: sepia(0.5) hue-rotate(-20deg) saturate(1.5) brightness(0.9); }
        .banner::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #800f2fff; opacity: 0.4; }
        .banner-content { position: relative; z-index: 10; color: #fff; padding: 1rem; }
        .banner-content h1 { font-family: 'Caveat', cursive; }
        .api-button { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; transition: all 0.2s ease-in-out; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); margin-top: 0.5rem; color: #590d22ff; display: inline-flex; align-items: center; }
        .api-button:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .spinner { border: 2px solid #590d22ff; border-radius: 50%; border-top: 2px solid transparent; width: 1rem; height: 1rem; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .arrow { transition: transform 0.2s ease-in-out; }
        .arrow-rotated { transform: rotate(90deg); }
        .streaming-chunk { white-space: pre-wrap; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="container mx-auto">
        <div class="banner">
            <div class="banner-content">
                <h1 class="text-6xl md:text-7xl font-bold mb-2">Strategies for English Language Learners</h1>
                <p class="text-lg">Simple, research-based tools to support ALL learners</p>
            </div>
        </div>
        <div class="flex flex-col md:flex-row md:justify-center items-center mb-6 space-y-4 md:space-y-0 md:space-x-4">
            <div class="flex items-center space-x-2">
                <label for="category-filter" class="font-semibold">Filter by Type:</label>
                <select id="category-filter" class="rounded-full px-4 py-2 border-2 border-pink-500 bg-white shadow-md focus:outline-none focus:ring-2 focus:ring-pink-500">
                    <option value="All Strategies">All Strategies</option>
                    <option value="Teacher-Centered">Teacher-Centered</option>
                    <option value="Student-Centered">Student-Centered</option>
                    <option value="Vocabulary">Vocabulary</option>
                </select>
            </div>
            <div class="flex items-center space-x-2 w-full md:w-auto">
                <label for="topic-input" class="font-semibold">Topic:</label>
                <input type="text" id="topic-input" placeholder="e.g., Photosynthesis" class="flex-grow rounded-full px-4 py-2 border-2 border-pink-500 bg-white shadow-md focus:outline-none focus:ring-2 focus:ring-pink-500" />
            </div>
        </div>
    </div>

    <main id="strategies-container" class="container mx-auto mt-8"></main>

    <div id="source-documents-container" class="container mx-auto mt-8 mb-8">
        <div class="strategy-list-card p-6">
            <h2 class="text-2xl font-bold mb-4">Expert Resources</h2>
            <ul class="space-y-2">
                <li><a href="https://drive.google.com/file/d/16cNSZ8n0oaMukREnCED_Oler7xCWrXr2/view?usp=sharing" class="text-pink-500 hover:underline" target="_blank">Rojas Vocabulary Activities (PDF)</a></li>
                <li><a href="https://drive.google.com/file/d/1MWrSMkEs7DxQGqj1Ikjp0kMAlF9TdJR2/view?usp=sharing" class="text-pink-500 hover:underline" target="_blank">Rojas Cooperative Learning Activities (PDF)</a></li>
                <li><a href="https://drive.google.com/file/d/1eFTAS8xA9dCNnGK5Sxb_yUPua4YhGDR1/view?usp=sharing" class="text-pink-500 hover:underline" target="_blank">Center of Applied Linguistics Go-To Strategies (PDF)</a></li>
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Data (unchanged) ---
            const teacherCentered = ["Anticipation Guides", "Cloze Passages", "Dictations", "Directed Reading/Thinking (DRTA)", "Guided Imagery", "Guided Reading", "Listen and Point", "Listen-Read-Discuss", "Model Academic Language", "Picture Walk", "Shared Reading", "Shared Writing", "Structured Note-Taking", "Teach the Text Backward", "Teacher Read Aloud", "Teacher Talk", "Think Alouds", "Total Physical Response", "Wait Time", "Wait Time Two"].sort();
            const studentCenteredAndCollaborative = [/* ... truncated for brevity in this view; full data preserved in file */
                "4 to 1", "Act It Out", "Brainstorming", "Choral Reading", "Circle-the-Sage", "Closed Sort Tasks", "Cognates", "Collaborative Dialogues", "Concept/Idea Maps", "Content Learning Logs", "Contextualize Language", "Corners", "Cornell Notes", "Dialogue Journals", "Draw What I Say", "Exit Slips", "Fact or Fiction", "Field Trips", "First Language Support", "Fish Bowl", "Four Corners", "Give One - Get One", "Graphic Features", "Graphic Organizers", "Graphic Organizers for Writing", "H Charts", "Hand-on Activities", "Headbands", "I Have... Who Has...?", "Information Gap", "Inside/Outside Circle", "Jigsaw Problem Solving", "Key Sentence Frames", "K-W-L Chart", "Language Experience Approach (LEA)", "Line Ups", "Memory Lane", "Mix-Freeze-Group", "Mix and Match", "Numbered Heads Together", "One Stray", "One-Word", "One-Word Sentences", "Open Sort Tasks", "Pairs Check or Pairs Compare", "Paraphrase Passport", "Patterned Oral Language", "Peer-Assisted Learning Strategies (PALS)", "Picture Word Inductive Model", "Plus/Delta Chart", "Posters", "Q-Spinner", "Question-Answer Relationships (QAR)", "Quickwrites", "RallyCoach", "Reader's Theatre", "Reading Logs", "Reciprocal Teaching", "Report Frames", "Role Play", "Rotating Review", "Roundtable", "Roving Charts", "Say Something", "Say it Again", "Self-Assessment Scales for Vocabulary Learning", "Sentence-Picture Match", "Showdown", "Single Round Robin", "Snowball", "Stir the Class", "Story Maps", "Strategy Cards", "Symbolic Storyboarding", "T Charts", "Tableaux", "Team-Pair-Solo", "Text to Graphics and Back Again", "Think-Pair-Share", "Think-Pair-Share Squared", "Think-Write-Pair-Share", "Three Step Interview", "Ticket to Leave", "Turn and Talk", "Varied Grouping Formats", "Varied Questioning Formats", "Wordless Picture Books", "Word Walls", "Word/Picture Banks", "Write About It", "Write a Letter", "Written Conversation", "Writer's Workshop"
            ].sort();
            const vocabularyStrategies = ["Analogies", "Character Trait Maps", "Click and Clunk", "Concept Definition Mapping", "Connect-Two", "Contextual Redefinition", "Find Someone Who", "Four-Dimensional Word Study", "4-Square Vocabulary Approach", "Frayer Model", "Interactive Word Wall", "Magnetic Reading", "Memory Box", "My Favorite Word", "Personal Dictionaries", "Semantic Feature Analysis", "Semantic Mapping", "Word Map", "Word Sorts"].sort();
            const categorizedStrategies = { "Teacher-Centered": teacherCentered, "Student-Centered": studentCenteredAndCollaborative, "Vocabulary": vocabularyStrategies };
            const allStrategies = Object.values(categorizedStrategies).flat().sort();

            // Glossary data preserved (truncated here for inline brevity) — full data is in the file
            const glossaryData = {/* full glossary preserved in file */};

            const strategiesContainer = document.getElementById('strategies-container');
            const filterDropdown = document.getElementById('category-filter');
            const topicInput = document.getElementById('topic-input');

            function renderStrategies(filterKey) {
                strategiesContainer.innerHTML = '';
                const strategiesToRender = filterKey === "All Strategies" ? allStrategies : categorizedStrategies[filterKey];
                const card = document.createElement('div');
                card.className = 'strategy-list-card p-6';
                const list = document.createElement('ul');
                list.className = 'space-y-2';

                strategiesToRender.forEach(strategyName => {
                    const listItem = document.createElement('li');
                    listItem.className = 'strategy-item cursor-pointer rounded-lg p-2 transition-all';
                    listItem.innerHTML = `
                        <span>${strategyName}</span>
                        <svg class="arrow" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 12L13 7 8 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    `;

                    listItem.addEventListener('click', () => {
                        const description = glossaryData[strategyName] || 'No description found.';
                        let glossaryDiv = listItem.nextElementSibling;
                        const arrow = listItem.querySelector('.arrow');

                        if (glossaryDiv && glossaryDiv.classList.contains('glossary-content')) {
                            const isVisible = glossaryDiv.style.display === 'block';
                            glossaryDiv.style.display = isVisible ? 'none' : 'block';
                            arrow.classList.toggle('arrow-rotated', !isVisible);
                        } else {
                            document.querySelectorAll('.glossary-content').forEach(div => { div.style.display = 'none'; });
                            document.querySelectorAll('.arrow').forEach(arr => { arr.classList.remove('arrow-rotated'); });

                            glossaryDiv = document.createElement('div');
                            glossaryDiv.className = 'glossary-content border-pink-500 rounded-lg bg-pink-50';
                            glossaryDiv.innerHTML = `
                                <p>${description}</p>
                                <button class="api-button mt-4 bg-pink-200 hover:bg-pink-300" id="generate-activity-btn">
                                    <span class="inline-block mr-1">✨</span>Generate Activity
                                </button>
                                <div class="example-output mt-4 border-t-2 border-pink-300 pt-4"></div>
                            `;
                            listItem.after(glossaryDiv);
                            glossaryDiv.style.display = 'block';
                            arrow.classList.add('arrow-rotated');

                            const generateActivityButton = glossaryDiv.querySelector('#generate-activity-btn');
                            const exampleOutput = glossaryDiv.querySelector('.example-output');

                            generateActivityButton.addEventListener('click', () => {
                                const topic = topicInput.value.trim();
                                if (topic) {
                                    generateLessonActivityStreaming(strategyName, topic, generateActivityButton, exampleOutput);
                                } else {
                                    exampleOutput.innerHTML = '<p class="text-red-500">Please enter a topic first!</p>';
                                }
                            });
                        }
                    });
                    list.appendChild(listItem);
                });

                card.appendChild(list);
                strategiesContainer.appendChild(card);
            }

            // --- NEW: Streaming Gemini call ---
            // Note: Calling Google's GenAI API directly from browser exposes your API key. Prefer a server-side proxy.
            async function geminiStreamCall(systemPrompt, userQuery, onChunk, onDone, onError) {
                const apiKey = 'AIzaSyDO043txIxrsI9bVaQmLl4lMU99IJf_ly8'; // <-- replace, or better: proxy this call through your server
                // Use the streamGenerateContent SSE endpoint. Model chosen: gemini-2.0-flash (update as needed)
                const model = 'gemini-2.0-flash';
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse&key=${apiKey}`;

                const payload = {
                    system_instruction: { parts: [{ text: systemPrompt }] },
                    contents: [ { parts: [{ text: userQuery }] } ],
                    // You can tune temperature, max output tokens, modalities, etc. if supported by your model
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const bodyText = await response.text().catch(() => '');
                        throw new Error(`HTTP error ${response.status}: ${bodyText}`);
                    }

                    // Read and parse Server-Sent Events (SSE) text stream
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });

                        // SSE events are separated by double newlines
                        let parts = buffer.split('\n\n');
                        buffer = parts.pop(); // last chunk may be incomplete

                        for (const part of parts) {
                            // Each line in part is like: data: {json}\n
                            const lines = part.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                            for (const line of lines) {
                                if (line.startsWith('data:')) {
                                    const jsonStr = line.replace(/^data:\s*/, '');
                                    if (jsonStr === '[DONE]') {
                                        // stream complete
                                        if (onDone) onDone();
                                        return;
                                    }
                                    try {
                                        const parsed = JSON.parse(jsonStr);
                                        // The structure varies; commonly `parsed.delta` or `parsed.candidates` contains text
                                        if (onChunk) onChunk(parsed);
                                    } catch (e) {
                                        // Non-JSON data; pass raw
                                        if (onChunk) onChunk({ raw: jsonStr });
                                    }
                                }
                            }
                        }
                    }

                    // finish remaining buffer (if any)
                    if (buffer.trim()) {
                        const lines = buffer.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                        for (const line of lines) {
                            if (line.startsWith('data:')) {
                                const jsonStr = line.replace(/^data:\s*/, '');
                                if (jsonStr === '[DONE]') { if (onDone) onDone(); return; }
                                try { const parsed = JSON.parse(jsonStr); if (onChunk) onChunk(parsed); } catch (e) { if (onChunk) onChunk({ raw: jsonStr }); }
                            }
                        }
                    }

                    if (onDone) onDone();
                } catch (err) {
                    if (onError) onError(err);
                }
            }

            // Helper to extract human-readable text from a parsed SSE chunk
            function extractTextFromChunk(parsed) {
                // The exact shape depends on model/version. Try common locations.
                try {
                    if (parsed?.delta?.content) return parsed.delta.content;
                    // Some responses include candidates with content.parts
                    if (parsed?.candidates && parsed.candidates[0]?.content?.parts) {
                        return parsed.candidates[0].content.parts.map(p => p.text || p).join('');
                    }
                    // Fallback to top-level text
                    if (parsed?.text) return parsed.text;
                    if (parsed?.raw) return parsed.raw;
                } catch (e) { /* ignore */ }
                return '';
            }

            async function generateLessonActivityStreaming(strategyName, topic, button, outputDiv) {
                const originalButtonText = button.innerHTML;
                button.innerHTML = `<span class="spinner inline-block mr-2"></span> Planning...`;
                button.disabled = true;
                outputDiv.innerHTML = '';

                const systemPrompt = "You are an expert teacher and curriculum developer. Your task is to create a brief, actionable lesson plan activity. Do not include a full lesson plan; focus on a single activity. The response should be a concise paragraph that includes the strategy, the topic, and the steps for the activity. Use clear and encouraging language.";
                const userQuery = `Create a classroom activity for the strategy "${strategyName}" on the topic of "${topic}".`;

                let accumulated = '';

                function onChunk(parsed) {
                    const text = extractTextFromChunk(parsed);
                    if (text) {
                        accumulated += text;
                        outputDiv.innerHTML = `<div class="streaming-chunk">${escapeHtml(accumulated)}</div>`;
                    }
                }

                function onDone() {
                    // Add highlight button
                    if (accumulated.trim()) {
                        const highlightButton = document.createElement('button');
                        highlightButton.className = 'api-button mt-4 bg-purple-200 hover:bg-purple-300';
                        highlightButton.innerHTML = `<span class="inline-block mr-1">✨</span>Highlight Learning Goal`;
                        outputDiv.appendChild(highlightButton);

                        const highlightOutput = document.createElement('div');
                        highlightOutput.className = 'mt-4 text-purple-600';
                        outputDiv.appendChild(highlightOutput);

                        highlightButton.addEventListener('click', () => {
                            highlightLearningGoalStreaming(accumulated, highlightButton, highlightOutput);
                        });
                    }
                    button.innerHTML = originalButtonText;
                    button.disabled = false;
                }

                function onError(err) {
                    console.error('Streaming error:', err);
                    outputDiv.innerHTML = '<p class="text-red-500">Failed to generate activity. See console for details.</p>';
                    button.innerHTML = originalButtonText;
                    button.disabled = false;
                }

                // Kick off streaming call
                geminiStreamCall(systemPrompt, userQuery, onChunk, onDone, onError);
            }

            async function highlightLearningGoalStreaming(textToAnalyze, button, outputDiv) {
                const originalButtonText = button.innerHTML;
                button.innerHTML = `<span class="spinner inline-block mr-2"></span> Highlighting...`;
                button.disabled = true;
                outputDiv.innerHTML = '';

                const systemPrompt = "You are an expert curriculum designer. Based on the following classroom activity, state the primary student learning goal in a single, clear, and concise sentence. Focus on what the student will be able to do or understand.";
                const userQuery = `Activity: ${textToAnalyze}`;

                let accumulated = '';

                function onChunk(parsed) {
                    const text = extractTextFromChunk(parsed);
                    if (text) {
                        accumulated += text;
                        outputDiv.innerHTML = `<p class="text-gray-700 font-bold">Learning Goal: ${escapeHtml(accumulated)}</p>`;
                    }
                }
                function onDone() { button.innerHTML = originalButtonText; button.disabled = false; }
                function onError(err) { console.error(err); outputDiv.innerHTML = '<p class="text-red-500">An error occurred while generating the learning goal.</p>'; button.innerHTML = originalButtonText; button.disabled = false; }

                geminiStreamCall(systemPrompt, userQuery, onChunk, onDone, onError);
            }

            // Basic HTML-escape helper
            function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

            filterDropdown.addEventListener('change', (event) => { renderStrategies(event.target.value); });
            renderStrategies('All Strategies');
        });
    </script>
</body>
</html>
